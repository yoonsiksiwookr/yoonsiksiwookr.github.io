<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="채팅 기록 보관함">
<meta property="og:title" content="김윤식&amp;박시우">
<meta property="og:type" content="website">
<title>김윤식&amp;박시우</title>
<style>
:root{
  --icon-size:125px; /* ← 아이콘 크기 */
  --chat-bg:#fdfcff; /* ← 대화창 배경색: 스케줄 사이트와 같은 배경색 */
  --bar:linear-gradient(90deg,#eaf5fb,#f1ecfc); --bubble-l:#dcedf8; --bubble-r:#e3dbf8;
  --text:#1b1c22; --sub:#7a7d89; --accent:#ff3d5a;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--chat-bg);color:#1b1c22;font:16px/1.45 "Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;color-scheme:light;-webkit-font-smoothing:antialiased}
.app{max-width:560px;height:100%;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--chat-bg)}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bar);border-bottom:1px solid #ece9f6;flex:none}
.pill{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.75);border:1px solid #e6e3f2;color:#38364d;cursor:pointer}
header h1{flex:1;margin:0;color:#38364d;font-size:19px;font-weight:700;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools{display:flex;align-items:center;gap:18px;height:44px;padding:0 16px;border-radius:22px;background:rgba(255,255,255,.75);border:1px solid #e6e3f2;color:#38364d}
svg{display:block}
#feed{flex:1;overflow-y:auto;padding:14px 14px 28px;scroll-behavior:smooth;color:var(--text);background:var(--chat-bg)}
.date{text-align:center;margin:16px 0 8px}
.date span{display:inline-block;font-size:12px;color:var(--sub);background:rgba(0,0,0,.05);padding:4px 12px;border-radius:12px}
.row{display:flex;gap:10px;margin-top:3px}
.row.first{margin-top:16px}
.row.r{flex-direction:row-reverse}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff}
.av.ghost{visibility:hidden}
.col{display:flex;flex-direction:column;min-width:0;max-width:78%}
.row.r .col{align-items:flex-end}
.name{font-size:12px;color:var(--sub);margin:0 0 5px 2px}
.row.r .name{margin:0 2px 5px 0}
.line{display:flex;align-items:flex-end;gap:7px}
.row.r .line{flex-direction:row-reverse}
.time{font-size:10px;color:var(--sub);white-space:nowrap;padding-bottom:2px}
.b{font-size:14px;line-height:1.4;background:var(--bubble-l);padding:9px 14px;border-radius:22px;word-break:break-word;white-space:pre-wrap}
.row.r .b{background:var(--bubble-r);color:#38364d}
.row:not(.r) .b{color:#38364d}
.play{background:rgba(56,54,77,.1)!important}
.photo{padding:0;overflow:hidden;background:none!important;cursor:zoom-in}
.photo img{display:block;width:100%;max-width:300px;max-height:380px;object-fit:cover;border-radius:20px}
.voice{display:flex;align-items:center;gap:10px;padding:9px 16px 9px 10px;min-width:200px}
.play{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
.wave{display:flex;align-items:center;gap:2px;height:28px;flex:1}
.wave i{display:block;width:3px;border-radius:2px;background:currentColor;opacity:.35}
.wave i.on{opacity:1}
.dur{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums;min-width:32px;text-align:right}
#down{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:50%;border:1px solid #e3e5ea;background:#fff;color:#222;display:none;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
#down.show{display:flex}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}
#lb.show{display:flex}
#lb img{max-width:96vw;max-height:92vh;border-radius:8px}
button:focus-visible,.pill:focus-visible{outline:2px solid #b9b2f0;outline-offset:2px}
.tools button{display:flex;align-items:center;justify-content:center;background:none;border:0;padding:0;color:inherit;cursor:pointer}
#sbar{display:none;align-items:center;gap:8px;padding:8px 14px;background:#fdfcff;border-bottom:1px solid #ece9f6;flex:none}
#sbar.show{display:flex}
#q{flex:1;min-width:0;font:inherit;font-size:15px;color:#38364d;padding:9px 14px;border:0;border-radius:18px;background:#f1ecfc}
#q:focus{outline:none;box-shadow:0 0 0 2px #cfc0f2}
#cnt{font-size:12px;color:var(--sub);white-space:nowrap;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
#sbar button{flex:none;width:34px;height:34px;border-radius:50%;border:0;background:#f1ecfc;color:#38364d;display:flex;align-items:center;justify-content:center;cursor:pointer}
#sbar button:disabled{opacity:.4;cursor:default}
/* 아이콘(이모티콘): 말풍선 없이 고정 크기 */
.b.icon{padding:0!important;background:none!important;border-radius:0}
.icon img{display:block;flex:none;width:var(--icon-size);height:var(--icon-size);object-fit:contain}
mark{background:#ffe9a8;color:inherit;border-radius:4px;padding:0 1px}
mark.cur{background:#ffb84d}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="pill" role="button" tabindex="0" aria-label="뒤로" onclick="history.length>1?history.back():location.href='../'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 5l-7 7 7 7"/></svg></div>
    <h1 id="title"></h1>
    <div class="tools">
      <button id="sbtn" aria-label="검색"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-5-5"/></svg></button>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </div>
  </header>
  <div id="sbar">
    <input id="q" type="search" placeholder="대화 검색" autocomplete="off" aria-label="대화 검색">
    <span id="cnt"></span>
    <button id="sup" aria-label="이전 결과" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg></button>
    <button id="sdn" aria-label="다음 결과" disabled><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
    <button id="sx" aria-label="검색 닫기"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>
  <main id="feed"></main>
  <button id="down" aria-label="맨 아래로"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg></button>
</div>
<div id="lb"><img alt=""></div>

<!-- 내장 대화 데이터: 같은 폴더에 messages.json 이 있으면 그것을 우선 사용하고, 없으면 이 데이터를 사용합니다 -->
<script id="chat-data" type="application/json">

<script>
async function main(CHAT){

const $ = s => document.querySelector(s);
const feed = $('#feed');
document.title = CHAT.title; $('#title').textContent = CHAT.title;
const ogt = document.querySelector('meta[property="og:title"]'); if(ogt) ogt.content = CHAT.title;

const sample = (c1,c2) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="600" height="760"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="600" height="760" fill="url(#g)"/><circle cx="300" cy="330" r="90" fill="rgba(255,255,255,.35)"/><rect x="170" y="450" width="260" height="150" rx="75" fill="rgba(255,255,255,.35)"/></svg>`);

const bubbles = [];
const fmtDate = d => { const [y,m,dd]=d.split('-').map(Number); const w='일월화수목금토'[new Date(y,m-1,dd).getDay()]; return `${y}년 ${m}월 ${dd}일 ${w}요일`; };
const fmtDur = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

function avatar(p, ghost){
  const d = document.createElement('div');
  d.className = 'av' + (ghost ? ' ghost' : '');
  if(p.avatar){ d.style.background = `url("${p.avatar}") center/cover`; }
  else { d.style.background = p.color || '#999'; d.textContent = p.name.slice(0,1); }
  return d;
}

function voiceBubble(m){
  const wrap = document.createElement('div');
  wrap.className = 'b voice';
  const btn = document.createElement('button');
  btn.className = 'play'; btn.setAttribute('aria-label','음성 재생');
  const icoPlay = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>';
  const icoPause = '<svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
  btn.innerHTML = icoPlay;
  const wave = document.createElement('div'); wave.className = 'wave';
  const N = 26, bars = [];
  for(let i=0;i<N;i++){ const e=document.createElement('i'); e.style.height = (6 + Math.abs(Math.sin(i*1.7+m.dur)*18)) + 'px'; wave.appendChild(e); bars.push(e); }
  const dur = document.createElement('span'); dur.className='dur'; dur.textContent = fmtDur(m.dur);
  wrap.append(btn, wave, dur);

  let audio = m.src ? new Audio(m.src) : null, t = 0, timer = null, playing = false;
  const paint = frac => bars.forEach((b,i)=>b.classList.toggle('on', i < Math.round(frac*N)));
  const stop = () => { playing=false; btn.innerHTML=icoPlay; clearInterval(timer); if(audio) audio.pause(); };
  const reset = () => { stop(); t=0; paint(0); dur.textContent=fmtDur(m.dur); if(audio) audio.currentTime=0; };
  btn.onclick = () => {
    if(playing){ stop(); return; }
    document.dispatchEvent(new CustomEvent('stopvoice',{detail:wrap}));
    playing = true; btn.innerHTML = icoPause;
    if(audio){
      audio.play().catch(reset);
      audio.ontimeupdate = () => { const d = audio.duration || m.dur; paint(audio.currentTime/d); dur.textContent = fmtDur(Math.ceil(d-audio.currentTime)); };
      audio.onended = reset;
    } else {
      timer = setInterval(()=>{ t+=0.1; paint(t/m.dur); dur.textContent=fmtDur(Math.max(0,Math.ceil(m.dur-t))); if(t>=m.dur) reset(); },100);
    }
  };
  document.addEventListener('stopvoice', e => { if(e.detail!==wrap && playing) reset(); });
  return wrap;
}

function body(m){
  if(m.type==='icon'){
    const d = document.createElement('div'); d.className='b icon';
    const img = document.createElement('img'); img.alt='아이콘'; img.loading='lazy'; img.src = m.src;
    d.appendChild(img); return d;
  }
  if(m.type==='image' || m.type==='img'){
    const d = document.createElement('div'); d.className='b photo';
    const img = document.createElement('img'); img.alt='사진'; img.loading='lazy';
    img.src = m.src || sample('#cdb89a','#8a7a66');
    img.onclick = () => { $('#lb img').src = img.src; $('#lb').classList.add('show'); };
    d.appendChild(img); return d;
  }
  if(m.type==='voice') return voiceBubble(m);
  const d = document.createElement('div'); d.className='b'; d.textContent = m.text; d._t = m.text || ''; bubbles.push(d); return d;
}

let prev = null;
CHAT.messages.forEach(m => {
  if(m.date){
    const dv = document.createElement('div'); dv.className='date';
    dv.innerHTML = '<span></span>'; dv.firstChild.textContent = fmtDate(m.date);
    feed.appendChild(dv); prev = null;
  }
  const p = CHAT.people[m.side];
  const first = !prev || prev.side !== m.side;
  const row = document.createElement('div');
  row.className = 'row ' + (m.side==='right' ? 'r ' : '') + (first ? 'first' : '');
  row.appendChild(avatar(p, !first));
  const col = document.createElement('div'); col.className='col';
  if(first){ const n=document.createElement('div'); n.className='name'; n.textContent=p.name; col.appendChild(n); }
  const line = document.createElement('div'); line.className='line';
  const t = document.createElement('span'); t.className='time'; t.textContent=m.time;
  line.append(body(m), t); col.appendChild(line);
  row.appendChild(col); feed.appendChild(row);
  prev = m;
});

const down = $('#down');
const atBottom = () => feed.scrollHeight - feed.scrollTop - feed.clientHeight < 80;
feed.addEventListener('scroll', () => down.classList.toggle('show', !atBottom()));
down.onclick = () => feed.scrollTo({top:feed.scrollHeight});
$('#lb').onclick = () => $('#lb').classList.remove('show');
feed.style.scrollBehavior='auto'; feed.scrollTop = feed.scrollHeight; feed.style.scrollBehavior='';

/* ---------- 검색 ---------- */
let hits = [], idx = -1;
const q = $('#q'), cnt = $('#cnt'), sup = $('#sup'), sdn = $('#sdn'), sbar = $('#sbar');
function clearMarks(){
  bubbles.forEach(b => { if(b._marked){ b.textContent = b._t; b._marked = false; } });
  hits = []; idx = -1;
}
function updateCount(){
  if(!q.value.trim()){ cnt.textContent = ''; }
  else cnt.textContent = hits.length ? (idx+1) + '/' + hits.length : '결과 없음';
  sup.disabled = sdn.disabled = hits.length < 2;
}
function focusHit(){
  hits.forEach(h => h.classList.remove('cur'));
  if(idx < 0 || !hits[idx]) return updateCount();
  hits[idx].classList.add('cur');
  hits[idx].scrollIntoView({block:'center'});
  updateCount();
}
function doSearch(){
  clearMarks();
  const key = q.value.trim();
  if(key){
    const lk = key.toLowerCase();
    bubbles.forEach(b => {
      const t = b._t, lt = t.toLowerCase();
      let i = lt.indexOf(lk); if(i < 0) return;
      b.textContent = ''; let last = 0;
      while(i >= 0){
        if(i > last) b.append(t.slice(last, i));
        const mk = document.createElement('mark');
        mk.textContent = t.slice(i, i + key.length);
        b.appendChild(mk); hits.push(mk);
        last = i + key.length; i = lt.indexOf(lk, last);
      }
      if(last < t.length) b.append(t.slice(last));
      b._marked = true;
    });
    idx = hits.length - 1; /* 가장 최근 결과부터 */
  }
  focusHit();
}
const step = d => { if(hits.length){ idx = (idx + d + hits.length) % hits.length; focusHit(); } };
$('#sbtn').onclick = () => { sbar.classList.toggle('show'); if(sbar.classList.contains('show')) q.focus(); else { q.value=''; doSearch(); } };
$('#sx').onclick = () => { sbar.classList.remove('show'); q.value=''; doSearch(); };
q.addEventListener('input', doSearch);
q.addEventListener('keydown', e => { if(e.key==='Enter'){ e.preventDefault(); step(e.shiftKey ? 1 : -1); } if(e.key==='Escape') $('#sx').click(); });
sup.onclick = () => step(-1);
sdn.onclick = () => step(1);
}

/* messages.json 이 있으면 우선 사용, 없거나 실패하면 내장 데이터 사용 */
async function load(){
  try{
    const r = await fetch('messages.json', {cache:'no-cache'});
    if(!r.ok) throw 0;
    return await r.json();
  }catch(e){
    return JSON.parse(document.getElementById('chat-data').textContent);
  }
}
load().then(main).catch(()=>{
  document.getElementById('feed').innerHTML='<p style="text-align:center;color:#8b8e99;margin-top:40px">대화 데이터를 불러오지 못했어요.<br>JSON 형식을 확인해 주세요.</p>';
});
</script>
</body>
