<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>일정추가 · 김윤식 박시우</title>
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="head">
  <div class="head-in">
    <div class="bar">
      <div class="month"><h1 style="font-size:1.5rem;min-width:0"><b>일정추가</b></h1></div>
      <nav class="nav" aria-label="페이지">
        <a href="index.html">스케줄</a>
        <a href="report.html" aria-current="page">일정추가</a>
      </nav>
    </div>
  </div>
</header>

<main class="report">
  <h2>두 배우의 스케줄을<br><b>알고 계신가요?</b></h2>
  <p class="lead">확인한 일정을 남겨주세요. 보내면 바로 스케줄 페이지에 올라가요. 로그인 없이 익명으로 보낼 수 있고, 잘못된 내용은 확인 후 내려요.</p>

  <form id="f" novalidate>
    <fieldset class="field">
      <legend>배우</legend>
      <div class="who">
        <label><input type="radio" name="actor" value="김윤식" checked><span class="s">🩵 김윤식</span></label>
        <label><input type="radio" name="actor" value="박시우"><span class="l">💜 박시우</span></label>
        <label><input type="radio" name="actor" value="두 배우 모두"><span class="m">🩵💜 함께</span></label>
      </div>
    </fieldset>

    <div class="row">
      <div class="field"><label for="date">날짜</label><input type="date" id="date" name="date" required></div>
      <div class="field"><label for="time">시간 <span class="opt">(선택)</span></label><input type="text" id="time" name="time" placeholder="예: 14시, 저녁 7시"></div>
    </div>

    <div class="field">
      <label for="body">일정 내용</label>
      <textarea id="body" name="message" required maxlength="200" placeholder="일정 이름을 적어주세요. (200자 이내)"></textarea>
    </div>

    <div class="field">
      <label for="place">위치 <span class="opt">(선택)</span></label>
      <input type="text" id="place" name="place" maxlength="100" placeholder="예: 대학로 ○○극장, 서울 코엑스">
    </div>

    <div class="field">
      <label for="src">링크 <span class="opt">(선택)</span></label>
      <input type="url" id="src" name="link" inputmode="url" placeholder="https://  공식 계정 게시물, 예매처 등">
    </div>

    <input class="hp" type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button class="send" id="send" type="submit">일정 추가하기</button>
    <p class="msg" id="msg" role="status"></p>
  </form>
</main>

<script src="assets/data.js"></script>
<script>
(function(){
  var f = document.getElementById('f'), msg = document.getElementById('msg'), btn = document.getElementById('send');
  function say(t, c){ msg.textContent = t; msg.className = 'msg ' + (c||''); }
  f.addEventListener('submit', function(e){
    e.preventDefault();
    if(!f.message.value.trim()){ say('일정 내용을 입력해주세요.', 'err'); f.message.focus(); return; }
    if(f._gotcha.value) return;
    var lk = f.link.value.trim();
    if(lk && !/^https?:\/\/\S+$/i.test(lk)){ say('링크는 http:// 또는 https:// 로 시작해야 해요.', 'err'); f.link.focus(); return; }
    if(!f.date.value){ say('날짜를 선택해주세요.', 'err'); f.date.focus(); return; }
    var url = (window.SITE||{}).api || '';
    if(!url || /YOUR_/.test(url)){ say('일정을 저장할 주소가 아직 설정되지 않았어요. (README 참고)', 'err'); return; }
    btn.disabled = true; say('보내는 중…');
    fetch(url, {method:'POST', mode:'no-cors', body:new URLSearchParams(new FormData(f))})
      .then(function(){ f.reset(); say('일정이 추가됐어요. 잠시 후 스케줄 페이지에 표시돼요 💜', 'ok'); })
      .catch(function(){ say('전송에 실패했어요. 잠시 후 다시 시도해주세요.', 'err'); })
      .then(function(){ btn.disabled = false; });
  });
})();
</script>
</body>
</html>
